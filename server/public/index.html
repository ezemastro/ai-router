<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Router - Minimal</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>AI Router — Minimal</h1>
    <label for="input">Mensaje</label>
    <textarea id="input" rows="4" placeholder="Escribí tu mensaje aquí..."></textarea>
    <div class="options">
      <div>
        <label for="model">Modelo</label>
        <!-- Las opciones se cargan desde GET /providers al abrir la página. -->
        <select id="model">
          <option value="">Automático (el más rápido disponible)</option>
        </select>
      </div>
      <div>
        <label for="token">Token API (solo para modelos pagos)</label>
        <input type="password" id="token" placeholder="Token API (solo para modelos pagos)" autocomplete="off" />
      </div>
    </div>
    <div class="controls">
      <button id="send">Enviar</button>
      <button id="clear">Limpiar</button>
    </div>

    <h2>Respuesta</h2>
    <pre id="output" class="output" aria-live="polite"></pre>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
